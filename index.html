<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Warning — Multi-Model Ensemble Rain Forecast</title>
    <meta name="description" content="Real-time hourly rain probability and precipitation forecasts combining GFS, ECMWF, ICON, Google WeatherNext 3, and NWS ensembles.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
    <meta name="theme-color" content="#09131d">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

    <div class="container">
        <main class="weather-card">
            <header class="top-bar">
                <div class="title-group">
                    <div class="brand-row">
                        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                        </svg>
                        <span class="brand-label">Rain Warning</span>
                    </div>
                    <h1 id="location-display">Loading location...</h1>
                </div>

                <div class="header-actions">
                    <button type="button" id="gps-button" title="Use My Location" aria-label="Use My Location" class="icon-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </button>
                    <button type="button" id="refresh-button" title="Refresh Forecast (R)" aria-label="Refresh Forecast" class="icon-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                            <polyline points="21 3 21 9 15 9"></polyline>
                        </svg>
                    </button>
                </div>
            </header>

            <section class="search-section" aria-label="Location search">
                <div class="search-wrap">
                    <form id="location-form" class="search-form" role="search">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input
                            type="text"
                            id="location-input"
                            placeholder="Search city or region..."
                            title="Search city or region (/)"
                            aria-label="Search city or region"
                            aria-autocomplete="list"
                            aria-controls="search-suggestions"
                            aria-expanded="false"
                            autocomplete="off"
                        >
                        <button type="submit" class="search-btn">Go</button>
                    </form>
                    <ul id="search-suggestions" class="suggestions-list hidden" role="listbox" aria-label="Matching locations"></ul>
                </div>
            </section>

            <section class="forecast-hero" aria-label="Forecast summary">
                <div id="weather-info" role="status" aria-live="polite">
                    <div class="loader"></div>
                    <p class="loading-text">Fetching ensemble forecast...</p>
                </div>

                <div id="warning-message" class="status-banner hidden" role="status" aria-live="polite"></div>

                <div id="metrics-strip" class="metrics-strip hidden" aria-label="Key forecast metrics">
                    <div class="metric">
                        <span class="metric-label">Peak Risk</span>
                        <span id="metric-peak" class="metric-value">--%</span>
                        <span id="metric-peak-time" class="metric-sub">--</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Total Rain</span>
                        <span id="metric-total" class="metric-value">--</span>
                        <span id="metric-total-window" class="metric-sub">next 12h</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Model Spread</span>
                        <span id="metric-spread" class="metric-value">--</span>
                        <span id="metric-models-count" class="metric-sub">--</span>
                    </div>
                </div>
            </section>

            <section class="chart-section" aria-label="Hourly forecast chart">
                <div class="chart-toolbar">
                    <div class="horizon-group" role="group" aria-label="Forecast horizon">
                        <button type="button" class="horizon-btn" data-hours="6" title="6-hour forecast (1)">6h</button>
                        <button type="button" class="horizon-btn active" data-hours="12" title="12-hour forecast (2)">12h</button>
                        <button type="button" class="horizon-btn" data-hours="24" title="24-hour forecast (3)">24h</button>
                    </div>
                    <div class="layer-group" role="group" aria-label="Chart layers">
                        <button type="button" id="chip-models" class="layer-chip" aria-pressed="false" title="Toggle individual models (M)">Models</button>
                        <button type="button" id="chip-confidence" class="layer-chip" aria-pressed="false" title="Toggle confidence interval (I)">Interval</button>
                        <button type="button" id="chip-amount" class="layer-chip" aria-pressed="false" title="Toggle expected rain amount (A)">Amount</button>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="rainChart"></canvas>
                </div>
            </section>

            <details class="settings-details">
                <summary>
                    <span>Preferences &amp; Thresholds</span>
                    <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </summary>
                <div class="settings-body">
                    <div class="settings-grid">
                        <div class="setting-item">
                            <label for="threshold-input">Warning Threshold (%)</label>
                            <input type="number" id="threshold-input" min="0" max="100" inputmode="numeric">
                        </div>
                        <div class="setting-item">
                            <label for="forecast-hours-input">Horizon (Hours)</label>
                            <input type="number" id="forecast-hours-input" min="1" max="24" inputmode="numeric">
                        </div>
                        <div class="setting-item">
                            <label for="alpha-input">&alpha; Quantile</label>
                            <input type="number" id="alpha-input" min="0.01" max="0.5" step="0.01" inputmode="decimal">
                        </div>
                        <div class="setting-item">
                            <label for="unit-system-select">Units</label>
                            <select id="unit-system-select">
                                <option value="metric">Metric (mm)</option>
                                <option value="imperial">Imperial (in)</option>
                            </select>
                        </div>
                    </div>

                    <div class="toggles-grid">
                        <label class="switch-row" for="time-format-toggle">
                            <span>24-Hour Clock</span>
                            <input type="checkbox" id="time-format-toggle" class="switch-input">
                        </label>
                        <label class="switch-row" for="confidence-toggle">
                            <span>Confidence Interval</span>
                            <input type="checkbox" id="confidence-toggle" class="switch-input">
                        </label>
                        <label class="switch-row" for="show-ensemble-toggle">
                            <span>Show Models</span>
                            <input type="checkbox" id="show-ensemble-toggle" class="switch-input">
                        </label>
                        <label class="switch-row" for="show-amount-toggle">
                            <span>Show Amount</span>
                            <input type="checkbox" id="show-amount-toggle" class="switch-input">
                        </label>
                    </div>
                </div>
            </details>

            <button type="button" id="install-button">Install App</button>

            <footer class="panel-footer">
                <div class="footer-row">
                    <button type="button" id="notification-btn" class="notif-btn">
                        Alerts: <span id="notification-status" class="status-value">Off</span>
                    </button>
                    <span class="updated-meta">Updated <span id="last-updated">Never</span></span>
                </div>
                <p id="data-source">Sources: --</p>
            </footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="app.js?v=10"></script>

</body>
</html>
